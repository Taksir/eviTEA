[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evitea"
version = "0.1.0.dev0"
description = "Evidence-integrated Transposable Element Analysis"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Md Taksir Hasan Majumder" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pymsbwt>=0.5",
    "numpy>=2.5,<3",
]

[project.urls]
Homepage = "https://github.com/Taksir/eviTEA"
Issues = "https://github.com/Taksir/eviTEA/issues"

[project.optional-dependencies]
# Whole-read TE-record fragment decoder of the paired-end anchor support layer.
# edlib ships no CPython 3.14 Windows wheel. The engine can run the decoder
# under another interpreter with edlib (AnchorPEInputs.edlib_python).
anchorpe = ["edlib>=1.3.9"]
# The library-free layer and the family-record commands (Linux or WSL).
library-free = ["mappy>=2.28", "parasail>=1.3"]

[project.scripts]
evitea = "evitea.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["evitea*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
