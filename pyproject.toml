[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evitea"
version = "0.1.0.dev0"
description = "Evidence-integrated Transposable Element Analysis"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Md Taksir Hasan Majumder" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "msbwt-modern3==0.3.0",
    "numpy>=2.5,<3",
]

[project.urls]
Homepage = "https://github.com/Taksir/evitea-v1"
Issues = "https://github.com/Taksir/evitea-v1/issues"

[project.optional-dependencies]
# Whole-read TE-record fragment decoder of the AnchorPE producer.  edlib ships
# no CPython 3.14 Windows wheel; the engine can instead run the same decoder
# under another interpreter that has it (``AnchorPEInputs.edlib_python``).
anchorpe = ["edlib>=1.3.9"]

[project.scripts]
evitea = "evitea.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["evitea*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
